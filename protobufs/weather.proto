syntax = "proto3";

message CityRequest {
    string city = 1;
}

message CityWeatherDataResponse {
    string city_name = 1;
    double temperature = 2;
    string weather_description = 3;
    int64 humidity = 4;
    double wind_speed = 5;
}

message HistoryRequest {
    string city = 1;
    string start_date = 2;
    string end_date = 3;
}

message HistoryEntry {
    string date = 1;
    double temperature = 2;
    int64 humidity = 3;
    double wind_speed = 4;
}

message HistoryResponse {
    repeated HistoryEntry entries = 1;
    string error = 2;
}

service WeatherData {
    rpc Weather (CityRequest) returns (CityWeatherDataResponse); 
    rpc WeatherHistory (HistoryRequest) returns (HistoryResponse);
}