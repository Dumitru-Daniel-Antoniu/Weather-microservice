version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: weather_backend
    ports:
      - "50051:50051"
    networks:
      - weather_network
    depends_on:
      - mongodb
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: weather_proxy
    ports:
      - "8000:8000"
    networks:
      - weather_network
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    container_name: weather_frontend
    ports:
      - "3000:80"
    networks:
      - weather_network
    depends_on:
      - proxy

  mongodb:
    image: mongo:latest
    container_name: weather_mongodb
    ports:
      - "27017:27017"
    networks:
      - weather_network
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    command: ["mongod", "--auth"]

networks:
  weather_network:
    driver: bridge

volumes:
  mongodb_data: